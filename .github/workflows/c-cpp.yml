name: Build C++ Code

on:
  schedule:
    - cron: '30 18 * * *'  # Runs at 12:00 AM IST (18:00 UTC)
    # Adjust the cron timing based on your specific requirement
    # Note: GitHub Actions uses UTC time for scheduled events

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Compile C++ code
      run: |
        # Compile all C++ files in the specified directories
        for dir in Mathematics Geometry Sorting Statistics numbers; do
          for file in $(find $dir -name "*.cpp"); do
            echo "Compiling $file"
            g++ -o ${file%.cpp}.out $file
          done
        done

   
