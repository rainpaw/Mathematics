name: Build and Run C++ Code

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Compile C++ code
      run: |
        # Compile all C++ files in the specified directories
        for dir in Mathematics Geometry Sorting Statistics numbers; do
          for file in $(find $dir -name "*.cpp"); do
            echo "Compiling $file"
            g++ -o ${file%.cpp}.out $file
          done
        done

   
